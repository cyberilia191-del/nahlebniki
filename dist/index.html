<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101010">
<title>НАХЛЕБНИКИ — сэндвич-шоп в Смоленске</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="wrap head-inner">
<a class="brand" href="#top" aria-label="Нахлебники, в начало"><span class="brand-symbol" data-icon="bread"></span><span>НАХЛЕБНИКИ</span></a>
<nav aria-label="Навигация"><a class="nav-active" href="#menu">Меню</a><button data-do="info">Доставка и самовывоз</button></nav>
<span class="city"><i data-icon="pin"></i> Смоленск</span>
<button class="cart-open" data-do="cart"><i data-icon="bag"></i><span>Корзина</span><b id="cart-count">0</b></button>
</div></header>
<main id="top" class="wrap">
<section class="hero" aria-labelledby="feature-title">
<div class="hero-copy"><span class="feature-tag"><i data-icon="star"></i> ХИТ МЕНЮ</span>
<h1 id="feature-title">ПАСТРАМИ<br>НА ГРИЛЕ</h1>
<p>Томлёная говядина, чеддер и огурчики<br class="wide"> на хрустящем хлебе.</p>
<div class="hero-action"><span id="hero-add"></span><strong>490 ₽</strong></div>
</div></section>
<section id="menu" aria-labelledby="menu-title">
<div class="section-heading"><h2 id="menu-title">МЕНЮ</h2><div class="rule"></div><span class="checker" aria-hidden="true"></span></div>
<div id="categories" class="categories" role="group" aria-label="Категории меню"></div>
<div id="products" class="products"></div>
</section></main>
<footer><div class="wrap"><strong>НАХЛЕБНИКИ</strong><span>Сэндвич-шоп · Смоленск</span><button data-do="info">О демо-заказах</button></div></footer>
<dialog id="panel" aria-labelledby="panel-title"><div class="panel-inner"><div class="panel-header"><h2 id="panel-title"></h2><button class="icon-btn" aria-label="Закрыть" data-do="close"><i data-icon="close"></i></button></div><div id="panel-body"></div></div></dialog>
<div class="sr" role="status" id="status"></div>
<script src="app.js"></script>
</body></html>
