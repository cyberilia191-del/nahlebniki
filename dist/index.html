<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101010">
<title>НАХЛЕБНИКИ — сэндвич-шоп в Смоленске</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="wrap head-inner">
<a class="brand" href="#top" data-do="home" aria-label="Нахлебники, в начало"><span class="brand-symbol" data-icon="bread"></span><span>НАХЛЕБНИКИ</span></a>
<span class="city"><i data-icon="pin"></i> Смоленск</span>
<button class="cart-open" data-do="cart"><i data-icon="bag"></i><span>Корзина</span><b id="cart-count">0</b></button>
</div></header>
<main id="top" class="wrap">
<section id="home-actions" class="home-actions" aria-labelledby="home-title">
<div class="home-heading">
  <div><p id="greeting">Привет!</p><h1 id="home-title">Что сегодня на хлебе?</h1></div>
  <button class="search-launch" data-do="search"><i data-icon="search"></i>Найти блюдо</button>
</div>
<button class="sandwich-feature" data-do="sandwiches" aria-label="Хочу сэндвич">
  <span>Хочу<br>сэндвич</span><img src="assets/plush-sandwich.webp" width="800" height="800" alt="">
</button>
<div class="quick-tiles">
  <button data-do="all-dishes"><i data-icon="grid"></i>Всё меню</button>
  <button data-do="pickup-location"><i data-icon="map"></i>Где нас найти</button>
  <button data-do="news"><i data-icon="megaphone"></i>Акции и новости</button>
  <button data-do="home-about"><i data-icon="sandwich"></i>О НАХЛЕБНИКАХ</button>
</div>
<a class="browse-menu" href="#menu" data-do="all-dishes">Перейти в каталог</a>
</section>
<section id="menu" hidden tabindex="-1" aria-labelledby="menu-title">
<div class="section-heading"><h2 id="menu-title">КАТАЛОГ</h2><div class="rule"></div>
<button class="favorite-filter" id="favorite-filter" data-view="toggle" aria-controls="products" aria-pressed="false"><i data-icon="heart"></i>Избранное</button></div>
<div id="categories" class="categories" role="group" aria-label="Категории меню"></div>
<div id="products" class="products"></div>
<div class="favorites-empty" id="favorites-empty" hidden>
<i data-icon="heart"></i><h3 id="empty-title">Пока нет избранного</h3>
<p>Нажмите сердечко на карточке блюда, чтобы сохранить его здесь.</p>
</div>
</section></main>
<footer><div class="wrap"><strong>НАХЛЕБНИКИ</strong><span>Сэндвич-шоп · Смоленск</span><button data-do="info">О демо-заказах</button></div></footer>
<nav class="app-nav" aria-label="Основные разделы">
<div class="nav-track">
<button data-tab="home" aria-current="page"><i data-icon="home"></i><span>Главная</span></button>
<button data-tab="catalog"><i data-icon="grid"></i><span>Каталог</span></button>
<button data-tab="pickup" aria-label="Где забрать заказ"><i class="map-circle" data-icon="map"></i></button>
<button data-tab="cart"><i data-icon="bag"></i><span>Корзина</span></button>
<button data-tab="profile"><i data-icon="person"></i><span>Профиль</span></button>
</div>
</nav>
<template id="empty-cart-content">
<section class="empty-cart" aria-labelledby="empty-cart-title">
  <div class="empty-cart-art"><img src="assets/plush-sandwich.webp" width="800" height="800" alt="Плюшевый сэндвич с румяной корочкой и хитрой улыбкой"></div>
  <h2 id="empty-cart-title">Упс! Кажется, здесь пусто…</h2>
  <p>Можете начать свой выбор с главной страницы или воспользоваться нашим каталогом.</p>
  <button class="empty-cart-catalog" data-do="menu">Перейти в каталог</button>
</section>
</template>
<template id="about-content">
<article class="about-shop">
<p class="about-address">Смоленск, ул. Дзержинского, 4</p>
<p class="about-intro">«Нахлебники» — первый сэндвич-шоп Смоленска. Здесь сэндвичи собирают на фокачче, которую пекут сами. Начинки кладут щедро, а к сэндвичу можно взять фирменную содовую.</p>
<figure class="about-photo"><img src="assets/guide-sandwich.jpg" width="460" height="613" alt="Две половинки сэндвича на фокачче в открытой коробке"></figure>
<p>В зале легко узнать девяностые. Пока готовится заказ, можно сыграть партию в настольный футбол или вспомнить любимую игру на аркадном автомате.</p>
<div class="about-founder"><img src="assets/guide-founder.png" width="64" height="64" alt="Портрет Сабита Гусейнова"><div><h3>Сабит Гусейнов</h3><p>Основатель «Нахлебников» и ресторана «Нега».</p></div></div>
<p class="about-credit">Рассказ подготовлен по материалу с фотографиями из смоленского гастрогида. <a class="about-source" target="_blank" rel="noopener noreferrer">«Куда идти за вкусным вау-эффектом»</a></p>
</article></template>
<dialog id="panel" aria-labelledby="panel-title"><div class="panel-inner"><div class="panel-header"><h2 id="panel-title"></h2><button class="icon-btn" aria-label="Закрыть" data-do="close"><i data-icon="close"></i></button></div><div id="panel-body"></div></div></dialog>
<div class="sr" role="status" id="status"></div>
<script src="app.js"></script>
</body></html>
